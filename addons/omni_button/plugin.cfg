name="OmniButton"
description="One Control for buttons with mouse, touch, keyboard and gamepad input: press, release, toggle, hover scaling, hold, swipe, cooldowns, typewriter text and a virtual joystick. Includes ready-made dialog windows (popups, toasts, dialogue box, narration) and the OmniDialog autoload."
author="Christopher Woodhouse"
version="0.1.5"
script="omni_button_plugin.gd"
