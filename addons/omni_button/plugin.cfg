[plugin]

name="OmniButton"
description="One Control for buttons with mouse, touch, keyboard and gamepad input: press, release, toggle, hover scaling, hold, swipe, cooldowns, typewriter text and a virtual joystick. Includes drag-and-drop button presets, dialog windows (popups, toasts, dialogue box, narration), title / pause / options menus with saved settings, and a controller cursor."
author="Christopher Woodhouse"
version="1.5.0"
script="omni_button_plugin.gd"
